name: Add Minna trailer embed
on:
  push:
    paths:
      - '.github/workflows/add-minna-trailer.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert trailer block
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('films/minna.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = '.minna-hero-note{margin-top:22px;font-size:13px;color:#6b665b}'
          css_add = css_anchor + '\n.minna-trailer{padding:72px 0;background:var(--minna-paper2)}.minna-trailer-wrap{max-width:1000px}.minna-trailer h2{font-family:inherit;font-size:clamp(34px,4vw,54px);font-weight:600;line-height:1.3;margin:0 0 28px}.minna-video{position:relative;width:100%;aspect-ratio:16/9;background:#111;box-shadow:0 18px 50px rgba(74,59,39,.14)}.minna-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}'
          if '.minna-video iframe' not in s:
              s = s.replace(css_anchor, css_add, 1)

          hero_end = '</div></div></section>\n<section class="minna-section" id="story">'
          trailer = '''</div></div></section>\n<section class="minna-trailer" id="trailer"><div class="wrap minna-trailer-wrap"><div class="eyebrow">Trailer</div><h2>予告編</h2><div class="minna-video"><iframe src="https://www.youtube.com/embed/3yUgiycZa_Y?si=fOjrchPd7rLyt0PX" title="映画『みんなのふね』予告編" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen loading="lazy"></iframe></div></div></section>\n<section class="minna-section" id="story">'''
          if 'id="trailer"' not in s:
              if hero_end not in s:
                  raise SystemExit('hero/story insertion point not found')
              s = s.replace(hero_end, trailer, 1)

          subnav_old = '<div class="wrap"><a href="#story">STORY</a>'
          subnav_new = '<div class="wrap"><a href="#trailer">TRAILER</a><a href="#story">STORY</a>'
          if 'href="#trailer">TRAILER' not in s:
              s = s.replace(subnav_old, subnav_new, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "tinymousefactory"
          git config user.email "y.n.evans@gmail.com"
          git add films/minna.html
          git diff --cached --quiet || git commit -m "Add trailer to Minna official page"
          git push
