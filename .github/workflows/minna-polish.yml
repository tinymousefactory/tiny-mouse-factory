name: Polish Minna page
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minna-polish.yml'
      - 'tools/minna_polish.py'
permissions:
  contents: write
jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python tools/minna_polish.py
      - name: Commit polished page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films/minna.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish final Minna page"
          git push
