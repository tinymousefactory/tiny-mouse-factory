name: Optimize site images to WebP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/optimize-images.yml'

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --upgrade pillow

      - name: Convert JPEG images to smaller WebP files and update references
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('.')
          image_dir = root / 'assets' / 'images'
          converted = {}
          original_total = 0
          webp_total = 0

          # Keep OGP cards as JPEG for maximum social-crawler compatibility.
          for src in sorted(image_dir.glob('*.jpg')):
              if src.name.startswith('ogp-'):
                  continue

              original_size = src.stat().st_size
              dst = src.with_suffix('.webp')

              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  im.save(dst, 'WEBP', quality=82, method=6)

              webp_size = dst.stat().st_size
              if webp_size < original_size:
                  converted[src.name] = dst.name
                  original_total += original_size
                  webp_total += webp_size
                  print(f'KEEP {src.name} -> {dst.name}: {original_size:,} -> {webp_size:,} bytes')
              else:
                  dst.unlink(missing_ok=True)
                  print(f'SKIP {src.name}: WebP was not smaller ({original_size:,} <= {webp_size:,})')

          # Update only references for images that were actually converted.
          text_files = list(root.glob('*.html')) + list((root / 'films').glob('*.html')) + [root / 'assets' / 'style.css']
          for path in text_files:
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original_text = text
              for old_name, new_name in converted.items():
                  text = text.replace(old_name, new_name)
              if text != original_text:
                  path.write_text(text, encoding='utf-8')
                  print(f'UPDATED REFERENCES: {path}')

          # Delete a JPEG only after a smaller WebP exists and all references were updated.
          for old_name, new_name in converted.items():
              src = image_dir / old_name
              dst = image_dir / new_name
              if dst.exists() and dst.stat().st_size < src.stat().st_size:
                  src.unlink()

          saved = original_total - webp_total
          pct = (saved / original_total * 100) if original_total else 0
          print(f'Converted {len(converted)} images; saved {saved:,} bytes ({pct:.1f}%).')
          PY

      - name: Commit optimized images
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No optimization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize site images to WebP"
          git push origin HEAD:main
