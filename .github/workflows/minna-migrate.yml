name: Migrate Minna Wix site
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minna-migrate.yml'
      - 'tools/minna_migrate.py'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 pillow
      - run: python tools/minna_migrate.py
      - name: Commit migrated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films/minna.html films/minna-screenings.html films.html sitemap.xml assets/images/minna-wix-*.webp
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Complete Minna Wix migration"
          git push
